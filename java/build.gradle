plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.schematicraft'

// Keep in lockstep with SchematiCraftAPI.CLIENT_VERSION in both the Java and the
// Kotlin client. The two clients ship the same surface at the same version.
version = '1.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

sourceSets {
    main {
        java {
            srcDir 'src'
        }
    }
    test {
        java {
            srcDir 'test'
        }
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            groupId = 'com.schematicraft'
            artifactId = 'api-client'
            from components.java
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
